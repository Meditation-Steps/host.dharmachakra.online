stages:
  - build
  - deploy

build:
  stage: build
  image: oven/bun:latest
  script:
    - bun install
    - bun run build
  artifacts:
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: manual

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mv dist public
  artifacts:
    paths:
      - public
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: manual