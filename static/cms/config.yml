# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: gitlab
  repo: meditationsteps/host-dharmachakra-online
  branch: main
  auth_type: pkce
  app_id: bf8e6c77f202acfe4f5c9a4b2ec969d49bed1e1077f5455ef6023d016afd52be

media_folder: static/images
collections:
  - name: svadhyaya
    label: Svadhyaya
    files:
      - name: en
        label: Svadhyaya
        file: static/svadhyaya/en.md
        format: raw
        fields:
          - { label: Body, name: body, widget: markdown }
      - name: ru
        label: Свадхьяя
        file: static/svadhyaya/ru.md
        format: raw
        fields:
          - { label: Body, name: body, widget: markdown }
